<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My GitHub Repositories</title>
  <script>__CHART_JS_INLINE__</script>
  <style>
    :root {
      --bg: #0b0b14;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: rgba(0, 0, 0, 0.3);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --badge-private: #f59e0b;
      --badge-fork: #3b82f6;
      --badge-archive: #ef4444;
      --header-bg: rgba(11, 11, 20, 0.7);
      --card-hover-bg: rgba(255, 255, 255, 0.08);
    }
    [data-theme="light"] {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-shadow: rgba(0, 0, 0, 0.05);
      --accent: #6d28d9;
      --accent-glow: rgba(109, 40, 217, 0.15);
      --text: #111827;
      --text-muted: #4b5563;
      --header-bg: rgba(249, 250, 251, 0.8);
      --card-hover-bg: #f3f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s, color 0.3s;
      min-height: 100vh;
      padding-top: 80px;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      backdrop-filter: blur(12px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--card-border);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
    }
    .nav-title { font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; }
    .theme-toggle {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background-color: var(--card-hover-bg); border-color: var(--accent); }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px var(--card-shadow);
    }
    .stat-card .val { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-bottom: 5px; }
    .stat-card .lbl { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    .chart-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px var(--card-shadow);
      min-height: 380px;
    }
    .chart-box h3 { margin-bottom: 20px; font-size: 1.1rem; color: var(--text-muted); }

    .controls-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px var(--card-shadow);
    }
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-bottom: 15px;
    }
    .control-row:last-child { margin-bottom: 0; }
    .search-input {
      flex: 1;
      min-width: 250px;
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .select-dropdown, .control-btn {
      background: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }
    .control-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .tag-bubble {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tag-bubble:hover, .tag-bubble.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

    .repos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 25px;
    }
    .repos-grid.list-view { grid-template-columns: 1fr; }

    .repo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px var(--card-shadow);
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }
    .repo-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px var(--accent-glow);
    }
    .repo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }
    .repo-title { font-size: 1.25rem; font-weight: 700; text-decoration: none; color: var(--text); }
    .repo-title:hover { color: var(--accent); }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; color: #fff; text-transform: uppercase; }
    .badge.private { background-color: var(--badge-private); }
    .badge.fork { background-color: var(--badge-fork); }
    .badge.archived { background-color: var(--badge-archive); }
    .repo-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; flex-grow: 1; }
    .indicators { display: flex; gap: 15px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }
    .indicator-item { display: flex; align-items: center; gap: 4px; }
    .repo-lang { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; }
    .lang-dot { width: 10px; height: 10px; border-radius: 50%; }
    .repo-commit { border-top: 1px solid var(--card-border); padding-top: 12px; font-size: 0.8rem; color: var(--text-muted); }
    .repo-commit-msg { font-style: italic; color: var(--text); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-meta-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .repo-tag { background: var(--card-hover-bg); color: var(--accent); font-size: 0.75rem; border-radius: 4px; padding: 2px 6px; }
    .group-header {
      grid-column: 1 / -1;
      margin-top: 30px;
      margin-bottom: 15px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
      font-size: 1.5rem;
    }
    footer { text-align: center; padding: 40px; color: var(--text-muted); border-top: 1px solid var(--card-border); margin-top: 60px; }
    @media (max-width: 900px) {
      .charts-container { grid-template-columns: 1fr; }
      header { padding: 0 20px; }
    }
  </style>
</head>
<body data-theme="dark">

<header>
  <div class="nav-title">
    <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
    <span>Repo Insight Center</span>
  </div>
  <button class="theme-toggle" id="themeBtn">Switch Light Mode</button>
</header>

<div class="container">

  <div class="dashboard-stats" id="statsGrid">
    <div class="stat-card"><div class="val" id="statTotal">0</div><div class="lbl">Total Repositories</div></div>
    <div class="stat-card"><div class="val" id="statStars">0</div><div class="lbl">Global Stars</div></div>
    <div class="stat-card"><div class="val" id="statForks">0</div><div class="lbl">Global Forks</div></div>
    <div class="stat-card"><div class="val" id="statPrivate">0</div><div class="lbl">Private Projects</div></div>
  </div>

  <div class="charts-container">
    <div class="chart-box"><h3>Primary Language Distribution</h3><canvas id="langChart"></canvas></div>
    <div class="chart-box"><h3>Push Activity Distribution (Monthly)</h3><canvas id="activityChart"></canvas></div>
  </div>

  <div class="controls-wrapper">
    <div class="control-row">
      <input type="text" class="search-input" id="searchInput" placeholder="Search by name, description, tags...">
      <select class="select-dropdown" id="langSelect"><option value="ALL">All Languages</option></select>
      <select class="select-dropdown" id="sortSelect">
        <option value="pushed">Recently Pushed</option>
        <option value="stars">Stars Count</option>
        <option value="forks">Forks Count</option>
        <option value="created">Created Date</option>
      </select>
    </div>
    <div class="control-row">
      <button class="control-btn active" id="btnAllType">All</button>
      <button class="control-btn" id="btnSourceType">Source Only</button>
      <button class="control-btn" id="btnForkType">Forks Only</button>
      <button class="control-btn" id="btnPrivateType">Private Only</button>
      <button class="control-btn" id="btnPublicType">Public Only</button>
      <div style="flex-grow:1"></div>
      <button class="control-btn active" id="btnViewGrid">Grid Layout</button>
      <button class="control-btn" id="btnViewList">List Layout</button>
      <button class="control-btn" id="btnViewGrouped">Grouped Language</button>
    </div>
    <div class="tags-container" id="tagsContainer"></div>
  </div>

  <div class="repos-grid" id="reposGrid"></div>

</div>

<footer><p>Auto-generated by nightly build | <span id="buildTimestamp"></span></p></footer>

<script>
  const REPO_DATA = __REPO_DATA__;
  const BUILD_TIME = '__BUILD_TIME__';

  // Theme toggle
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', () => {
    const cur = document.body.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    themeBtn.textContent = next === 'dark' ? 'Switch Light Mode' : 'Switch Dark Mode';
    recreateCharts();
  });

  document.getElementById('buildTimestamp').textContent = new Date(BUILD_TIME).toLocaleString();

  // Stats
  document.getElementById('statTotal').textContent = REPO_DATA.length;
  document.getElementById('statStars').textContent = REPO_DATA.reduce((a,r) => a + r.stars, 0);
  document.getElementById('statForks').textContent = REPO_DATA.reduce((a,r) => a + r.forks, 0);
  document.getElementById('statPrivate').textContent = REPO_DATA.filter(r => r.isPrivate).length;

  // Filters state
  let searchFilter = '', selectedLang = 'ALL', sortCriterion = 'pushed';
  let relativeFilter = 'all', currentViewMode = 'grid', selectedTag = null;

  // Language dropdown
  const langs = [...new Set(REPO_DATA.map(r => r.language ? r.language.name : null).filter(Boolean))].sort();
  const langSelect = document.getElementById('langSelect');
  langs.forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; langSelect.appendChild(o); });

  // Tags
  const tagCount = {};
  REPO_DATA.flatMap(r => r.tags).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
  const topTags = Object.keys(tagCount).sort((a,b) => tagCount[b] - tagCount[a]).slice(0, 15);
  const tagsContainer = document.getElementById('tagsContainer');
  topTags.forEach(tag => {
    const b = document.createElement('span'); b.className = 'tag-bubble';
    b.textContent = tag + ' (' + tagCount[tag] + ')';
    b.addEventListener('click', () => {
      if (selectedTag === tag) { selectedTag = null; b.classList.remove('selected'); }
      else { document.querySelectorAll('.tag-bubble').forEach(x => x.classList.remove('selected')); selectedTag = tag; b.classList.add('selected'); }
      render();
    });
    tagsContainer.appendChild(b);
  });

  document.getElementById('searchInput').addEventListener('input', e => { searchFilter = e.target.value.toLowerCase(); render(); });
  langSelect.addEventListener('change', e => { selectedLang = e.target.value; render(); });
  document.getElementById('sortSelect').addEventListener('change', e => { sortCriterion = e.target.value; render(); });

  [{id:'btnAllType',v:'all'},{id:'btnSourceType',v:'source'},{id:'btnForkType',v:'fork'},{id:'btnPrivateType',v:'private'},{id:'btnPublicType',v:'public'}].forEach(x => {
    document.getElementById(x.id).addEventListener('click', () => {
      ['btnAllType','btnSourceType','btnForkType','btnPrivateType','btnPublicType'].forEach(i => document.getElementById(i).classList.remove('active'));
      document.getElementById(x.id).classList.add('active');
      relativeFilter = x.v; render();
    });
  });

  [{id:'btnViewGrid',m:'grid'},{id:'btnViewList',m:'list'},{id:'btnViewGrouped',m:'grouped'}].forEach(x => {
    document.getElementById(x.id).addEventListener('click', () => {
      ['btnViewGrid','btnViewList','btnViewGrouped'].forEach(i => document.getElementById(i).classList.remove('active'));
      document.getElementById(x.id).classList.add('active');
      currentViewMode = x.m; render();
    });
  });

  function timeAgo(d) {
    if (!d) return 'never';
    const diff = Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
    return diff === 0 ? 'today' : diff === 1 ? 'yesterday' : diff + ' days ago';
  }

  function sortRepos(repos) {
    return [...repos].sort((a, b) => {
      if (sortCriterion === 'pushed') return new Date(b.pushedAt||0) - new Date(a.pushedAt||0);
      if (sortCriterion === 'created') return new Date(b.createdAt||0) - new Date(a.createdAt||0);
      if (sortCriterion === 'stars') return b.stars - a.stars;
      if (sortCriterion === 'forks') return b.forks - a.forks;
      return 0;
    });
  }

  function card(repo) {
    const div = document.createElement('div'); div.className = 'repo-card';
    div.innerHTML = `
      <div class="repo-header">
        <a href="${repo.url}" target="_blank" class="repo-title">${repo.name}</a>
        <div class="badges">${repo.isPrivate?'<span class="badge private">Private</span>':''}${repo.isFork?'<span class="badge fork">Fork</span>':''}${repo.isArchived?'<span class="badge archived">Archived</span>':''}</div>
      </div>
      <p class="repo-desc">${repo.description || '<i>No description</i>'}</p>
      <div class="repo-meta-tags">${repo.tags.map(t => '<span class="repo-tag">'+t+'</span>').join('')}</div>
      <div class="repo-lang">${repo.language ? '<span class="lang-dot" style="background-color:'+repo.language.color+'"></span><span>'+repo.language.name+'</span>' : '<span>Unknown</span>'}</div>
      <div class="indicators">
        <div class="indicator-item">⭐ ${repo.stars}</div><div class="indicator-item">🍴 ${repo.forks}</div>
        <div class="indicator-item">🐛 ${repo.issues}</div><div class="indicator-item">🔀 ${repo.pullRequests}</div>
      </div>
      ${repo.lastCommit ? '<div class="repo-commit"><div class="repo-commit-msg" title="'+repo.lastCommit.message+'">'+repo.lastCommit.message+'</div><div style="font-size:0.75rem">By '+repo.lastCommit.author+' · '+timeAgo(repo.lastCommit.date)+'</div></div>' : '<div class="repo-commit" style="font-style:italic">No commit details</div>'}
    `;
    return div;
  }

  function render() {
    const grid = document.getElementById('reposGrid');
    grid.innerHTML = '';
    grid.classList.toggle('list-view', currentViewMode === 'list');

    let filtered = REPO_DATA.filter(r => {
      const q = (r.name + (r.description||'') + r.tags.join('')).toLowerCase();
      if (searchFilter && !q.includes(searchFilter)) return false;
      if (selectedLang !== 'ALL' && (!r.language || r.language.name !== selectedLang)) return false;
      if (selectedTag && !r.tags.includes(selectedTag)) return false;
      if (relativeFilter === 'fork' && !r.isFork) return false;
      if (relativeFilter === 'source' && r.isFork) return false;
      if (relativeFilter === 'private' && !r.isPrivate) return false;
      if (relativeFilter === 'public' && r.isPrivate) return false;
      return true;
    });

    const sorted = sortRepos(filtered);

    if (currentViewMode === 'grouped') {
      const grp = {};
      sorted.forEach(r => { const l = r.language ? r.language.name : 'Unknown'; if (!grp[l]) grp[l] = []; grp[l].push(r); });
      Object.keys(grp).sort().forEach(l => {
        const h = document.createElement('div'); h.className = 'group-header'; h.textContent = l + ' (' + grp[l].length + ')'; grid.appendChild(h);
        grp[l].forEach(r => grid.appendChild(card(r)));
      });
    } else {
      sorted.forEach(r => grid.appendChild(card(r)));
    }
  }

  let langChart, actChart;
  function recreateCharts() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    const ts = isDark ? '#9ca3af' : '#4b5563';
    const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';

    const lc = {};
    REPO_DATA.forEach(r => { const n = r.language ? r.language.name : 'Unknown'; lc[n] = (lc[n]||0)+1; });
    const top = Object.entries(lc).sort((a,b)=>b[1]-a[1]).slice(0,8);

    if (langChart) langChart.destroy();
    langChart = new Chart(document.getElementById('langChart').getContext('2d'), {
      type: 'doughnut',
      data: { labels: top.map(x=>x[0]), datasets: [{ data: top.map(x=>x[1]), backgroundColor: ['#6d28d9','#3b82f6','#10b981','#f59e0b','#ec4899','#374151','#6b7280','#9ca3af'], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: ts } } } }
    });

    const mp = {};
    REPO_DATA.forEach(r => { if (!r.pushedAt) return; const d = new Date(r.pushedAt); const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); mp[k]=(mp[k]||0)+1; });
    const months = Object.keys(mp).sort().slice(-12);

    if (actChart) actChart.destroy();
    actChart = new Chart(document.getElementById('activityChart').getContext('2d'), {
      type: 'bar',
      data: { labels: months, datasets: [{ label: 'Repos Pushed', data: months.map(m=>mp[m]), backgroundColor: '#8b5cf6', borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { color: ts } }, y: { grid: { color: gridColor }, ticks: { color: ts } } }, plugins: { legend: { display: false } } }
    });
  }

  recreateCharts();
  render();
</script>
</html>
